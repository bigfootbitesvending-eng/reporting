<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Reports — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* Page-specific component styles. Colors/fonts reference the shared
     tokens from /shared/styles.css rather than redefining a palette. */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 32px 48px;
  }
  header {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 1.25rem 1rem;
    border-bottom: 2px solid var(--ink);
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 1rem;
  }
  .month-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .month-nav-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
  }
  .month-nav-btn:hover {
    border-color: var(--ledger-green);
    color: var(--ledger-green);
  }
  .month-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    min-width: 150px;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    padding: 4px 8px;
  }
  .month-label:hover, .month-label:focus-visible {
    background: var(--ledger-green-soft);
    outline: none;
  }
  /* The native date input still does the real work (opening the
     picker for jump-to-arbitrary-month), but stays visually hidden.
     The label is now the one control users see, instead of two
     widgets competing for the same job. */
  input[type="month"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .status-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    min-height: 18px;
  }
  .status-line.error { color: var(--status-error); }

  .location-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .location-card {
    background: #fff;
    border: 1px solid var(--rule);
    border-left: 4px solid var(--ledger-green);
    border-radius: 6px;
    padding: 1.1rem 1.25rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .location-card:hover { background: var(--ledger-green-soft); }
  .location-card:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .location-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 8px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    color: #fff;
  }
  .badge.not_started { background: var(--status-not-started); }
  .badge.draft { background: var(--status-draft); }
  .badge.sent { background: var(--status-sent); }
  .badge.error { background: var(--status-error); }
  .location-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .empty-state, .loading-state {
    padding: 40px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* ---- Review screen ------------------------------------------------ */
  .back-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
  }
  .back-btn:hover { color: var(--ledger-green); }

  .review-header { margin-bottom: 20px; }
  .review-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .review-header .review-sub { font-size: 13px; color: var(--ink-soft); }

  .progress-steps { display: flex; gap: 4px; margin-bottom: 24px; }
  .progress-step {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .progress-step.done { background: var(--ledger-green); color: #fff; border-color: var(--ledger-green); }
  .progress-step.current { border-color: var(--ledger-green); color: var(--ledger-green); }

  .error-banner {
    background: var(--status-error-soft);
    border: 1px solid var(--status-error);
    color: var(--status-error);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .text-block { margin-bottom: 20px; }
  .text-block .block-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .text-block-inner { border-left: 4px solid var(--ledger-green); padding-left: 14px; }
  textarea {
    width: 100%;
    min-height: 110px;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    resize: vertical;
    background: #fff;
    color: var(--ink);
  }
  .thumbs { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .thumb-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .thumb-btn.active-up { background: var(--status-sent); color: #fff; border-color: var(--status-sent); }
  .thumb-btn.active-down { background: var(--status-error); color: #fff; border-color: var(--status-error); }
  .notes-field { display: none; margin-top: 8px; width: 100%; min-height: 60px; font-size: 13px; }
  .notes-field.visible { display: block; }

  .section-card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .section-card.is-skipped { opacity: 0.55; }
  .section-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .section-card-header h3 { font-size: 14px; }
  .skip-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--rule);
    cursor: pointer;
    background: var(--status-not-started);
    color: #fff;
  }
  .skip-btn.is-skipped { background: var(--ledger-green); border-color: var(--ledger-green); }
  .section-empty { font-size: 13px; color: var(--ink-soft); }
  .comparison-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .revenue-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
  }
  .metric-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .metric-value { font-size: 22px; font-weight: 700; }
  .metric-change { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .metric-change.positive { color: var(--status-sent); }
  .metric-change.negative { color: var(--status-error); }
  .metric-change.neutral { color: var(--ink-soft); }
  .metric-daily-rate { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .data-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .data-item .data-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 2px; }
  .data-item .data-value { font-size: 16px; font-weight: 600; }
  .item-list { list-style: none; margin: 0; padding: 0; }
  .item-list li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .bestsellers-list { display: flex; flex-direction: column; gap: 4px; }
  .bestseller-category-label { font-weight: 600; font-size: 14px; color: var(--ink); margin: 10px 0 4px; }
  .bestseller-category-label:first-child { margin-top: 0; }

  .bt-heatmap-wrap { overflow-x: auto; }
  .bt-heatmap-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .bt-heatmap-table th {
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  .bt-heatmap-table td {
    padding: 8px;
    text-align: center;
    font-weight: 600;
    white-space: nowrap;
  }
  .bt-day-label {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .bt-legend {
    margin-top: 10px;
    width: 140px;
  }
  .bt-legend-swatch {
    width: 100%;
    height: 10px;
    border-radius: 3px;
    background: linear-gradient(to right, #FAEEDA 0%, #EF9F27 50%, #D85A30 100%);
  }
  .bt-legend-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .action-row { display: flex; gap: 12px; margin-top: 24px; }
  button.primary, button.secondary {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  button.primary { background: var(--ledger-green); color: #fff; border: none; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--rule); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .action-note { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .action-note.error { color: var(--status-error); }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 280px;
    max-width: 90vw;
    padding: 14px 18px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 1000;
    animation: toast-in 0.15s ease-out;
  }
  .toast.success { background: var(--status-sent); }
  .toast.error { background: var(--status-error); }
  .toast[hidden] { display: none !important; }
  .toast-dismiss {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, -10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

<header>
  <h1>Monthly Reports</h1>
  <div class="month-control">
    <button type="button" class="month-nav-btn" id="prev-month" aria-label="Previous month">‹</button>
    <span class="month-label" id="month-label" role="button" tabindex="0" title="Click to jump to a specific month"></span>
    <button type="button" class="month-nav-btn" id="next-month" aria-label="Next month">›</button>
    <input type="month" id="month-select" aria-label="Jump to specific month">
  </div>
</header>

<main>
  <section id="dashboard-view">
    <div class="status-line" id="status-line"></div>
    <div id="results"></div>
  </section>

  <section id="review-view" hidden>
    <button type="button" class="back-btn" id="back-to-dashboard">‹ Back to all locations</button>
    <div class="status-line" id="review-status-line"></div>
    <div id="review-content"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/shared/config.js"></script>
<script>
  // API_KEY comes from /shared/config.js (const API_KEY = '...').
  const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/reports';
  // Swap to '/webhook-test/reports' below while testing an unpublished workflow:
  // const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook-test/reports';

  const monthInput = document.getElementById('month-select');
  const monthLabel = document.getElementById('month-label');
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  const statusLine = document.getElementById('status-line');
  const resultsEl = document.getElementById('results');

  const dashboardView = document.getElementById('dashboard-view');
  const reviewView = document.getElementById('review-view');
  const reviewStatusLine = document.getElementById('review-status-line');
  const reviewContent = document.getElementById('review-content');
  const backBtn = document.getElementById('back-to-dashboard');

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let lastLoadedApiMonth = null;
  let currentReport = null;
  let skippedSections = new Set();
  let openingRating = null;
  let closingRating = null;

  // ---- Month navigation ---------------------------------------------

  function currentMonthValue() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  }

  // The current calendar month is always in-progress and its data is incomplete —
  // showing it invites confusion ("why does September look empty/wrong?"). The last
  // navigable month is always the one just before the real current month; it becomes
  // available automatically the moment the calendar rolls over, no manual update needed.
  function maxAllowedMonthValue() {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function monthInputToApiValue(monthInputValue) {
    return `${monthInputValue}-01`;
  }

  function updateMonthLabel() {
    const [year, month] = monthInput.value.split('-').map(Number);
    monthLabel.textContent = `${MONTH_NAMES[month - 1]} ${year}`;
    nextBtn.disabled = monthInput.value >= maxAllowedMonthValue();
  }

  function shiftMonth(delta) {
    const [year, month] = monthInput.value.split('-').map(Number);
    const d = new Date(year, month - 1 + delta, 1);
    const candidate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    monthInput.value = candidate > maxAllowedMonthValue() ? maxAllowedMonthValue() : candidate;
    updateMonthLabel();
    loadReports();
  }

  function openMonthPicker() {
    if (typeof monthInput.showPicker === 'function') {
      try { monthInput.showPicker(); return; } catch (e) { /* fall through to focus */ }
    }
    monthInput.focus();
  }

  // ---- Toast notifications -------------------------------------------
  // Errors stay on screen until dismissed — a save failure is not
  // something that should be allowed to quietly scroll out of view.
  // Success auto-dismisses since it needs acknowledgment, not action.

  let toastTimeout = null;

  function showToast(message, type, autoDismissMs) {
    const toast = document.getElementById('toast');
    toast.className = `toast ${type}`;
    toast.innerHTML = '';

    const msg = document.createElement('span');
    msg.textContent = message;
    toast.appendChild(msg);

    const dismiss = document.createElement('button');
    dismiss.type = 'button';
    dismiss.className = 'toast-dismiss';
    dismiss.setAttribute('aria-label', 'Dismiss');
    dismiss.textContent = '\u00D7';
    dismiss.addEventListener('click', hideToast);
    toast.appendChild(dismiss);

    toast.hidden = false;

    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = autoDismissMs ? setTimeout(hideToast, autoDismissMs) : null;
  }

  function hideToast() {
    document.getElementById('toast').hidden = true;
    if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }
  }

  // ---- View switching -------------------------------------------------

  function showView(view) {
    dashboardView.hidden = view !== 'dashboard';
    reviewView.hidden = view !== 'review';
    hideToast();
  }

  // ---- Dashboard view -------------------------------------------------

  function formatTimestamp(ts) {
    if (!ts) return null;
    const d = new Date(ts);
    return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  }

  function statusLabel(status) {
    const labels = { not_started: 'Not started', draft: 'Ready to review', sent: 'Sent', error: 'Error' };
    return labels[status] || status;
  }

  function renderLocations(locations) {
    resultsEl.innerHTML = '';
    if (!locations || locations.length === 0) {
      resultsEl.innerHTML = '<div class="empty-state">No active locations returned.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'location-grid';

    locations.forEach(loc => {
      const card = document.createElement('div');
      card.className = 'location-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');

      const name = document.createElement('p');
      name.className = 'location-name';
      name.textContent = loc.location;

      const badge = document.createElement('span');
      badge.className = `badge ${loc.status}`;
      badge.textContent = statusLabel(loc.status);

      const meta = document.createElement('div');
      meta.className = 'location-meta';
      if (loc.status === 'sent' && loc.sent_at) {
        meta.textContent = `Sent ${formatTimestamp(loc.sent_at)}`;
      } else if (loc.generated_at) {
        meta.textContent = `Generated ${formatTimestamp(loc.generated_at)}`;
      }

      card.appendChild(name);
      card.appendChild(badge);
      if (meta.textContent) card.appendChild(meta);

      const open = () => openReview(loc.location);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });

      grid.appendChild(card);
    });

    resultsEl.appendChild(grid);
  }

  async function loadReports() {
    lastLoadedApiMonth = monthInputToApiValue(monthInput.value);
    statusLine.className = 'status-line';
    statusLine.textContent = 'Loading…';
    resultsEl.innerHTML = '<div class="loading-state">Loading locations…</div>';

    try {
      const res = await fetch(`${API_BASE}/list?month=${lastLoadedApiMonth}`, {
        method: 'GET',
        headers: { 'X-API-Key': API_KEY }
      });
      if (!res.ok) {
        const bodyText = await res.text();
        throw new Error(`${res.status} ${res.statusText} — ${bodyText}`);
      }
      const locations = await res.json();
      statusLine.textContent = '';
      renderLocations(locations);
    } catch (err) {
      statusLine.className = 'status-line error';
      statusLine.textContent = `Couldn't load reports: ${err.message}`;
      resultsEl.innerHTML = '';
      console.error(err);
    }
  }

  // ---- Review view ------------------------------------------------------

  async function openReview(location) {
    showView('review');
    reviewStatusLine.className = 'status-line';
    reviewStatusLine.textContent = 'Loading report — this can take about a minute if the draft hasn\u2019t been generated yet.';
    reviewContent.innerHTML = '';

    try {
      const res = await fetch(`${API_BASE}/draft?location=${encodeURIComponent(location)}&month=${lastLoadedApiMonth}`, {
        method: 'GET',
        headers: { 'X-API-Key': API_KEY }
      });
      const body = await res.json();
      if (!res.ok) {
        throw new Error(body.error || `${res.status} ${res.statusText}`);
      }
      currentReport = body;
      skippedSections = new Set(body.sections_skipped || []);
      openingRating = body.opening_rating;
      closingRating = body.closing_rating;
      reviewStatusLine.textContent = '';
      renderReview(body);
    } catch (err) {
      reviewStatusLine.className = 'status-line error';
      reviewStatusLine.textContent = `Couldn't load report: ${err.message}`;
      console.error(err);
    }
  }

  function progressStepIndex(report) {
    if (report.status === 'error') return -1;
    if (report.status === 'sent') return 3;
    return 1; // draft — ready, currently in review
  }

  function renderProgressSteps(report) {
    const labels = ['Draft ready', 'Your review', 'Sent'];
    const current = progressStepIndex(report);
    const wrap = document.createElement('div');
    wrap.className = 'progress-steps';
    labels.forEach((label, i) => {
      const step = document.createElement('div');
      step.className = 'progress-step';
      if (current >= 0 && i < current) step.classList.add('done');
      if (i === current) step.classList.add('current');
      step.textContent = label;
      wrap.appendChild(step);
    });
    return wrap;
  }

  function renderTextBlock(labelText, fieldKey, value, rating) {
    const block = document.createElement('div');
    block.className = 'text-block';

    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = labelText;
    block.appendChild(label);

    const inner = document.createElement('div');
    inner.className = 'text-block-inner';

    const textarea = document.createElement('textarea');
    textarea.id = `${fieldKey}-textarea`;
    textarea.value = value || '';
    inner.appendChild(textarea);

    const thumbs = document.createElement('div');
    thumbs.className = 'thumbs';

    const upBtn = document.createElement('button');
    upBtn.type = 'button';
    upBtn.className = 'thumb-btn';
    upBtn.textContent = '\u{1F44D}';
    upBtn.setAttribute('aria-label', 'Thumbs up');

    const downBtn = document.createElement('button');
    downBtn.type = 'button';
    downBtn.className = 'thumb-btn';
    downBtn.textContent = '\u{1F44E}';
    downBtn.setAttribute('aria-label', 'Thumbs down');

    const notesField = document.createElement('textarea');
    notesField.id = `${fieldKey}-notes`;
    notesField.className = 'notes-field';
    notesField.placeholder = 'What was wrong with this? (optional)';
    notesField.value = (fieldKey === 'opening' ? currentReport.opening_notes : currentReport.closing_notes) || '';

    function applyRatingState(r) {
      upBtn.classList.toggle('active-up', r === 1);
      downBtn.classList.toggle('active-down', r === -1);
      notesField.classList.toggle('visible', r === -1);
    }
    applyRatingState(rating);

    function commitRating(newRating) {
      const prevRating = fieldKey === 'opening' ? openingRating : closingRating;
      if (fieldKey === 'opening') openingRating = newRating; else closingRating = newRating;
      applyRatingState(newRating);
      upBtn.disabled = true;
      downBtn.disabled = true;
      saveDraft().then(success => {
        if (!success) {
          if (fieldKey === 'opening') openingRating = prevRating; else closingRating = prevRating;
          applyRatingState(prevRating);
        }
      }).finally(() => {
        upBtn.disabled = false;
        downBtn.disabled = false;
      });
    }

    upBtn.addEventListener('click', () => {
      const current = fieldKey === 'opening' ? openingRating : closingRating;
      commitRating(current === 1 ? null : 1);
    });
    downBtn.addEventListener('click', () => {
      const current = fieldKey === 'opening' ? openingRating : closingRating;
      commitRating(current === -1 ? null : -1);
    });

    thumbs.appendChild(upBtn);
    thumbs.appendChild(downBtn);
    inner.appendChild(thumbs);
    inner.appendChild(notesField);
    block.appendChild(inner);
    return block;
  }

  function renderSectionBody(section) {
    if (!section.has_data) {
      const p = document.createElement('p');
      p.className = 'section-empty';
      p.textContent = 'No data available for this section yet.';
      return p;
    }

    const data = section.data || {};

    if (section.section_key === 'revenue') {
      return renderRevenueSection(data);
    }

    if (section.section_key === 'best_sellers') {
      return renderBestSellersSection(data);
    }

    if (section.section_key === 'busiest_times') {
      return renderBusiestTimesSection(data);
    }
    
    if (Array.isArray(data.items)) {
      const list = document.createElement('ul');
      list.className = 'item-list';
      data.items.forEach((item) => {
        const li = document.createElement('li');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.included !== false;
        checkbox.addEventListener('change', () => { item.included = checkbox.checked; });
        const label = document.createElement('span');
        label.textContent = item.name || item.product_name || JSON.stringify(item);
        li.appendChild(checkbox);
        li.appendChild(label);
        list.appendChild(li);
      });
      return list;
    }

    // Generic fallback for any future atomic section with a flat shape.
    // Explicitly skips nested objects rather than stringifying them —
    // the root cause of the "[object Object]" bug was rendering a value
    // without checking its type first.
    const grid = document.createElement('div');
    grid.className = 'data-grid';
    Object.entries(data).forEach(([key, val]) => {
      if (val === null || val === undefined || typeof val === 'object') return;
      const item = document.createElement('div');
      item.className = 'data-item';
      const label = document.createElement('div');
      label.className = 'data-label';
      label.textContent = key;
      const value = document.createElement('div');
      value.className = 'data-value';
      value.textContent = val;
      item.appendChild(label);
      item.appendChild(value);
      grid.appendChild(item);
    });
    return grid;
  }

  const METRIC_LABELS = { revenue: 'Revenue', items_sold: 'Items Sold', transactions: 'Transactions' };
  const METRIC_ORDER = ['revenue', 'items_sold', 'transactions'];

  function formatMetricValue(key, value) {
    if (value === null || value === undefined) return '\u2014';
    return key === 'revenue' ? `$${value.toFixed(2)}` : Math.round(value).toLocaleString();
  }

  function formatPctChange(pct) {
    if (pct === null || pct === undefined) return { text: '\u2014', cls: 'neutral' };
    const sign = pct > 0 ? '+' : '';
    const cls = pct > 0 ? 'positive' : (pct < 0 ? 'negative' : 'neutral');
    const arrow = pct > 0 ? '\u25B2 ' : (pct < 0 ? '\u25BC ' : '');
    return { text: `${arrow}${sign}${pct}%`, cls };
  }

  function renderRevenueSection(data) {
    const wrap = document.createElement('div');

    if (data.comparison_period_label) {
      const label = document.createElement('div');
      label.className = 'comparison-label';
      label.textContent = `Compared to ${data.comparison_period_label}`;
      wrap.appendChild(label);
    }

    const grid = document.createElement('div');
    grid.className = 'revenue-metrics';

    METRIC_ORDER.forEach(key => {
      const metric = data[key];
      if (!metric) return;

      const block = document.createElement('div');
      block.className = 'metric-block';

      const label = document.createElement('div');
      label.className = 'metric-label';
      label.textContent = METRIC_LABELS[key] || key;

      const value = document.createElement('div');
      value.className = 'metric-value';
      value.textContent = formatMetricValue(key, metric.current);

      const change = formatPctChange(metric.pct_change);
      const changeEl = document.createElement('div');
      changeEl.className = `metric-change ${change.cls}`;
      changeEl.textContent = change.text;

      const rate = document.createElement('div');
      rate.className = 'metric-daily-rate';
      rate.textContent = `Daily rate: ${formatMetricValue(key, metric.current_daily_rate)} (vs ${formatMetricValue(key, metric.prior_daily_rate)})`;

      block.appendChild(label);
      block.appendChild(value);
      block.appendChild(changeEl);
      block.appendChild(rate);
      grid.appendChild(block);
    });

    wrap.appendChild(grid);
    return wrap;
  }

  function renderBestSellersSection(data) {
    const wrap = document.createElement('div');
    const items = data.items || [];
    const flags = data.data_quality_flags || [];
  
    if (items.length === 0) {
      const p = document.createElement('p');
      p.className = 'section-empty';
      p.textContent = 'No category winners for this period.';
      wrap.appendChild(p);
      return wrap;
    }
  
    // Items arrive pre-grouped by category — Assemble Output sorts alphabetically
    // and keeps tied items adjacent under the same category — so a single pass
    // through the array is enough, no re-grouping needed here.
    const list = document.createElement('div');
    list.className = 'bestsellers-list';
  
    let currentCategory = null;
    let categoryGroup = null;
  
    items.forEach((item) => {
      if (item.category !== currentCategory) {
        currentCategory = item.category;
        const catLabel = document.createElement('div');
        catLabel.className = 'bestseller-category-label';
        catLabel.textContent = item.category;
        list.appendChild(catLabel);
        categoryGroup = document.createElement('ul');
        categoryGroup.className = 'item-list';
        list.appendChild(categoryGroup);
      }
  
      const li = document.createElement('li');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.included !== false;
      checkbox.addEventListener('change', () => { item.included = checkbox.checked; });
      const label = document.createElement('span');
      const unitsLabel = item.units_sold === 1 ? '1 unit' : `${item.units_sold} units`;
      const tiedLabel = item.tied ? ' (tied)' : '';
      label.textContent = `${item.product_name} — ${unitsLabel}${tiedLabel}`;
      li.appendChild(checkbox);
      li.appendChild(label);
      categoryGroup.appendChild(li);
    });
  
    wrap.appendChild(list);
  
    if (flags.length > 0) {
      const note = document.createElement('div');
      note.className = 'action-note';
      note.textContent = `Data quality note: ${flags.length} item${flags.length > 1 ? 's' : ''} sold with no recorded price this period — ${flags.map(f => f.product_name).join(', ')}.`;
      wrap.appendChild(note);
    }
  
    return wrap;
  }

  function getHeatmapColor(intensity) {
    const cream = [250, 238, 218];  // #FAEEDA
    const amber = [239, 159, 39];   // #EF9F27
    const coral = [216, 90, 48];    // #D85A30
    const lerp = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const rgb = intensity <= 0.5
      ? lerp(cream, amber, intensity / 0.5)
      : lerp(amber, coral, (intensity - 0.5) / 0.5);
    return '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
  }

  function getHeatmapTextColor(intensity) {
    return intensity < 0.55 ? '#633806' : '#FAE5C8';
  }

  function renderBusiestTimesSection(data) {
    const wrap = document.createElement('div');
  
    const caption = document.createElement('div');
    caption.className = 'bt-caption';
    caption.textContent = 'Average transactions per time block';
    wrap.appendChild(caption);
  
    const bins = data.bins || [];
    const heatmap = data.heatmap || [];
    if (bins.length === 0 || heatmap.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'section-empty';
      empty.textContent = 'No busiest-times data available for this period.';
      wrap.appendChild(empty);
      return wrap;
    }
  
    const allValues = heatmap.flatMap(row => row.cells.map(c => c.avg_transactions));
    const maxValue = Math.max(...allValues, 0);
  
    const tableWrap = document.createElement('div');
    tableWrap.className = 'bt-heatmap-wrap';
  
    const table = document.createElement('table');
    table.className = 'bt-heatmap-table';
  
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    headerRow.appendChild(document.createElement('th')); // blank corner cell, above day labels
    bins.forEach(bin => {
      const th = document.createElement('th');
      th.textContent = bin.label;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);
  
    const tbody = document.createElement('tbody');
    heatmap.forEach(row => {
      const tr = document.createElement('tr');
  
      const dayCell = document.createElement('td');
      dayCell.className = 'bt-day-label';
      dayCell.textContent = row.day_short;
      tr.appendChild(dayCell);
  
      row.cells.forEach(cell => {
        const td = document.createElement('td');
        const intensity = maxValue > 0 ? cell.avg_transactions / maxValue : 0;
        td.style.backgroundColor = getHeatmapColor(intensity);
        td.style.color = getHeatmapTextColor(intensity);
        td.textContent = cell.avg_transactions;
        td.title = `${row.day} — ${bins[cell.bin_index].label}: ${cell.avg_transactions} avg transactions`;
        tr.appendChild(td);
      });
  
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);
  
    const legend = document.createElement('div');
    legend.className = 'bt-legend';
  
    const swatch = document.createElement('div');
    swatch.className = 'bt-legend-swatch';
    legend.appendChild(swatch);
  
    const labels = document.createElement('div');
    labels.className = 'bt-legend-labels';
    const lowLabel = document.createElement('span');
    lowLabel.textContent = 'Slower';
    const highLabel = document.createElement('span');
    highLabel.textContent = 'Busier';
    labels.appendChild(lowLabel);
    labels.appendChild(highLabel);
    legend.appendChild(labels);
  
    wrap.appendChild(legend);
  
    return wrap;
  }
  
  function renderSectionCard(section) {
    const card = document.createElement('div');
    card.className = 'section-card';
    const isSkipped = skippedSections.has(section.section_key);
    if (isSkipped) card.classList.add('is-skipped');

    const header = document.createElement('div');
    header.className = 'section-card-header';
    const h3 = document.createElement('h3');
    h3.textContent = section.display_name;
    const skipBtn = document.createElement('button');
    skipBtn.type = 'button';
    skipBtn.className = 'skip-btn';
    if (isSkipped) skipBtn.classList.add('is-skipped');
    skipBtn.textContent = isSkipped ? 'Include' : 'Skip';
    skipBtn.addEventListener('click', () => {
      const wasSkipped = skippedSections.has(section.section_key);
      if (wasSkipped) {
        skippedSections.delete(section.section_key);
      } else {
        skippedSections.add(section.section_key);
      }
      const nowSkipped = !wasSkipped;

      // Mirrors pick-list.html: commit this action immediately rather than
      // batching it behind a separate Save click. Updating just this card's
      // DOM (not a full renderReview()) also means any in-progress opening/
      // closing text edits never get discarded — saveDraft() reads whatever
      // is currently live in the textareas, so nothing is lost either way.
      card.classList.toggle('is-skipped', nowSkipped);
      skipBtn.classList.toggle('is-skipped', nowSkipped);
      skipBtn.textContent = nowSkipped ? 'Include' : 'Skip';
      skipBtn.disabled = true;

      saveDraft().then(success => {
        if (!success) {
          // Save failed — revert the toggle so the screen never shows a
          // state that wasn't actually persisted.
          if (nowSkipped) skippedSections.delete(section.section_key);
          else skippedSections.add(section.section_key);
          card.classList.toggle('is-skipped', wasSkipped);
          skipBtn.classList.toggle('is-skipped', wasSkipped);
          skipBtn.textContent = wasSkipped ? 'Include' : 'Skip';
        }
      }).finally(() => { skipBtn.disabled = false; });
    });
    header.appendChild(h3);
    header.appendChild(skipBtn);
    card.appendChild(header);
    card.appendChild(renderSectionBody(section));
    return card;
  }

  async function saveDraft() {
    if (!currentReport) return false;
    const saveBtn = document.getElementById('save-draft-btn');
    if (saveBtn) saveBtn.disabled = true;

    const openingNotesEl = document.getElementById('opening-notes');
    const closingNotesEl = document.getElementById('closing-notes');

    const payload = {
      report_id: currentReport.report_id,
      opening_text: document.getElementById('opening-textarea').value,
      closing_text: document.getElementById('closing-textarea').value,
      opening_rating: openingRating,
      opening_notes: openingNotesEl ? (openingNotesEl.value || null) : null,
      closing_rating: closingRating,
      closing_notes: closingNotesEl ? (closingNotesEl.value || null) : null,
      sections_skipped: Array.from(skippedSections),
      sections_data: currentReport.sections
    };

    try {
      const res = await fetch(`${API_BASE}/draft`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify(payload)
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);

      currentReport = body;
      skippedSections = new Set(body.sections_skipped || []);
      openingRating = body.opening_rating;
      closingRating = body.closing_rating;

      showToast('Draft saved.', 'success', 2500);
      return true;
    } catch (err) {
      showToast(`Couldn't save: ${err.message}`, 'error', null);
      console.error(err);
      return false;
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  }

  async function approveReport() {
    if (!currentReport) return;
    if (!window.confirm('Approve and send this report? This cannot be undone.')) return;

    const approveBtn = document.getElementById('approve-btn');
    const saveBtn = document.getElementById('save-draft-btn');
    if (approveBtn) approveBtn.disabled = true;
    if (saveBtn) saveBtn.disabled = true;

    // Approve sends whatever is currently stored in the database, not
    // whatever happens to be live in the textareas — save first so the
    // email can never go out with stale text.
    const saved = await saveDraft();
    if (!saved) {
      showToast('Could not save your edits — send cancelled.', 'error', null);
      if (approveBtn) approveBtn.disabled = false;
      if (saveBtn) saveBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify({ report_id: currentReport.report_id })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);

      currentReport = body;
      showToast('Report sent.', 'success', 3000);
      renderReview(currentReport);
    } catch (err) {
      showToast(`Couldn't send: ${err.message}`, 'error', null);
      console.error(err);
      if (approveBtn) approveBtn.disabled = false;
      if (saveBtn) saveBtn.disabled = false;
    }
  }

  function renderReview(report) {
    reviewContent.innerHTML = '';

    const reviewHeader = document.createElement('div');
    reviewHeader.className = 'review-header';
    const h2 = document.createElement('h2');
    h2.textContent = report.location;
    const sub = document.createElement('div');
    sub.className = 'review-sub';
    const [y, m] = report.month.split('-');
    sub.textContent = `${MONTH_NAMES[parseInt(m, 10) - 1]} ${y}`;
    reviewHeader.appendChild(h2);
    reviewHeader.appendChild(sub);
    reviewContent.appendChild(reviewHeader);

    reviewContent.appendChild(renderProgressSteps(report));

    if (report.status === 'error') {
      const banner = document.createElement('div');
      banner.className = 'error-banner';
      banner.textContent = report.error_message || 'Report generation failed for an unspecified reason.';
      reviewContent.appendChild(banner);
      return;
    }

    reviewContent.appendChild(renderTextBlock('Opening', 'opening', report.opening_text, openingRating));

    (report.sections || []).forEach(section => {
      reviewContent.appendChild(renderSectionCard(section));
    });

    reviewContent.appendChild(renderTextBlock('Closing', 'closing', report.closing_text, closingRating));

    if (report.status === 'sent') {
      const sentNote = document.createElement('div');
      sentNote.className = 'action-note';
      const sentTime = report.sent_at
        ? new Date(report.sent_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
        : '';
      sentNote.textContent = `This report was sent${sentTime ? ' ' + sentTime : ''}.`;
      reviewContent.appendChild(sentNote);
      return;
    }

    const actionRow = document.createElement('div');
    actionRow.className = 'action-row';

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.id = 'save-draft-btn';
    saveBtn.className = 'secondary';
    saveBtn.textContent = 'Save draft';
    saveBtn.addEventListener('click', saveDraft);

    const approveBtn = document.createElement('button');
    approveBtn.type = 'button';
    approveBtn.id = 'approve-btn';
    approveBtn.className = 'primary';
    approveBtn.textContent = 'Approve and send';
    approveBtn.addEventListener('click', approveReport);

    actionRow.appendChild(saveBtn);
    actionRow.appendChild(approveBtn);
    reviewContent.appendChild(actionRow);
  }

  backBtn.addEventListener('click', () => {
    showView('dashboard');
    currentReport = null;
  });

  // ---- Init ---------------------------------------------------------

  monthInput.max = maxAllowedMonthValue();
  monthInput.value = maxAllowedMonthValue();
  updateMonthLabel();
  monthInput.addEventListener('change', () => {
    // The max attribute should stop this in every modern browser's native picker,
    // but clamp explicitly rather than trust that alone.
    if (monthInput.value > maxAllowedMonthValue()) monthInput.value = maxAllowedMonthValue();
    updateMonthLabel();
    loadReports();
  });
  prevBtn.addEventListener('click', () => shiftMonth(-1));
  nextBtn.addEventListener('click', () => shiftMonth(1));
  monthLabel.addEventListener('click', openMonthPicker);
  monthLabel.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMonthPicker(); }
  });
  loadReports();
</script>

</body>
